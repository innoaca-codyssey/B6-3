<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>프로젝트와 할 일</title></head>
<body>
<nav><a href="/">홈</a>
{% if auth %}
 | <a href="/app/projects">프로젝트</a> | <a href="/app/tasks">할 일</a> | {{ auth.username }}님 환영합니다
<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ auth.csrf }}"><button type="submit">로그아웃</button></form>
{% else %} | <a href="/login">로그인</a>{% endif %}</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
