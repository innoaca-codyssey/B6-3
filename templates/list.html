{% extends 'base.html' %}
{% block content %}<h1>할 일 목록</h1>
<form method="get" action="/app/tasks">
<label>제목 검색 <input name="q" value="{{ q }}" maxlength="100"></label>
<label>상태 <select name="completed"><option value="">전체</option><option value="false" {{ 'selected' if completed == 'false' else '' }}>진행 중</option><option value="true" {{ 'selected' if completed == 'true' else '' }}>완료</option></select></label>
<label>프로젝트 <select name="project_id"><option value="">전체</option>{% for project in projects %}<option value="{{ project.id }}" {{ 'selected' if project_id == project.id else '' }}>{{ project.name }}</option>{% endfor %}</select></label>
<button>검색</button> <a href="/app/tasks">조건 초기화</a></form>
<ul>{% for task in tasks %}<li><a href="/app/tasks/{{ task.id }}">{{ task.title }}</a> | {{ task.project_name }} | {{ '완료' if task.completed else '진행 중' }}</li>{% else %}<li>검색 조건에 맞는 할 일이 없습니다.</li>{% endfor %}</ul><a href="/app/projects">프로젝트 보기</a>{% endblock %}
