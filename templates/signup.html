{% extends 'base.html' %}
{% block content %}<h1>회원가입</h1>
{% if message %}<p role="alert">{{ message }}</p>{% endif %}
<form method="post" action="/signup">
<input type="hidden" name="csrf" value="{{ csrf }}">
<p><label>ID <input name="username" value="{{ username }}" required minlength="3" maxlength="40" autocomplete="username"></label></p>
<p>영문 소문자, 숫자, _, ., -를 사용할 수 있습니다.</p>
<p><label>비밀번호 <input type="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password"></label></p>
<p>비밀번호는 8자 이상, UTF-8 기준 72바이트 이내입니다. 한글은 한 글자에 3바이트를 사용합니다.</p>
<button type="submit">가입하기</button></form><a href="/login">로그인으로 돌아가기</a>
{% endblock %}
