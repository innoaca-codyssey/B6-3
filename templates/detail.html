{% extends 'base.html' %}
{% block content %}<h1>{{ task.title }}</h1>
<dl><dt>ID</dt><dd>{{ task.id }}</dd><dt>제목</dt><dd>{{ task.title }}</dd><dt>내용</dt><dd><pre>{{ task.description }}</pre></dd>
<dt>작성일시 (UTC)</dt><dd>{{ task.created_at }}</dd><dt>프로젝트</dt><dd><a href="/app/projects/{{ task.project_id }}">{{ task.project_name }}</a></dd><dt>상태</dt><dd>{{ '완료' if task.completed else '진행 중' }}</dd></dl>
<form method="post" action="/app/tasks/{{ task.id }}/state"><input type="hidden" name="csrf" value="{{ auth.csrf }}"><input type="hidden" name="completed" value="{{ 'false' if task.completed else 'true' }}"><button type="submit">{{ '진행 중으로 변경' if task.completed else '완료로 변경' }}</button></form>
<p><a href="/app/tasks/{{ task.id }}/edit">수정</a> <a href="/app/tasks">목록으로</a></p>
<form method="post" action="/app/tasks/{{ task.id }}/delete"><input type="hidden" name="csrf" value="{{ auth.csrf }}"><button type="submit">삭제</button></form>{% endblock %}
